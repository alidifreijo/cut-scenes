# Free Supabase projects pause after 7 days without activity.
# This asks the database one tiny question every 3 days so that never happens.
name: Keep Supabase awake
on:
  schedule:
    - cron: '17 9 */3 * *'   # every 3 days, 09:17 UTC
  workflow_dispatch: {}        # "Run workflow" button, to test it by hand
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ask for one published film
        env:
          # Public key, the same one the website uses. Not a secret.
          KEY: sb_publishable_Zg3cUPulNaHauNq6UxyDlg_Qp9xAvHE
        run: |
          curl -fsS "https://bgbpzzpgiqeiretcuiiq.supabase.co/rest/v1/films?select=id&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" > /dev/null
          echo "Supabase is awake."
