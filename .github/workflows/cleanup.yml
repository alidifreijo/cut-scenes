# Keeps the promise in privacy.html: gift links and stills that were never
# published are kept for up to 12 months.
#
# Once a month it deletes:
#   - gift links (puzzles) older than 12 months
#   - community submissions still pending or rejected after 12 months
#     (your own drafts and anything published are never touched)
#   - uploaded images in stills/uploads/ older than 12 months that nothing left uses
# The leaderboard stays.
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_DB_URL          the same one the backup uses
#   SUPABASE_SECRET_KEY      Supabase → Project Settings → API Keys → Secret key (sb_secret_…)
#                            Only lives here. Never in the code, never in chat.
# To try it without deleting anything: Actions → Monthly cleanup → Run workflow → dry run.
name: Monthly cleanup
on:
  schedule:
    - cron: '29 4 2 * *'     # the 2nd of every month, 04:29 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only list what would be deleted'
        type: boolean
        default: true
jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      API: https://bgbpzzpgiqeiretcuiiq.supabase.co
      DRY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
    steps:
      - name: Keep the password out of the logs
        # The password travels apart from the address (PGPASSWORD), so an error
        # can never echo it back, and every form of it is masked anyway.
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          python3 - <<'PY'
          import os, re, urllib.parse as u
          url = os.environ.get("DB_URL", "")
          m = re.match(r"^([a-z]+://[^:/@]*):(.*)@([^@]*)$", url, re.S)
          if not m:
              # unexpected format: keep the old behaviour, GitHub still masks the whole secret
              open(os.environ["GITHUB_ENV"], "a").write("DB_SAFE_URL<<EOV\n" + url + "\nEOV\n")
              raise SystemExit(0)
          raw = m.group(2); pw = u.unquote(raw)
          for v in {raw, pw, u.quote(pw, safe="")}:
              print("::add-mask::" + v)
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write("PGPASSWORD<<EOV\n" + pw + "\nEOV\n")
              f.write("DB_SAFE_URL=" + m.group(1) + "@" + m.group(3) + "\n")
          PY
      - name: Check the secrets
        run: |
          test -n "$DB_URL" || { echo "Add the SUPABASE_DB_URL secret first."; exit 1; }
          test -n "$KEY"    || { echo "Add the SUPABASE_SECRET_KEY secret first."; exit 1; }
          echo "Dry run: $DRY"
          # read-only call, so a wrong key shows up now and not when there is something to delete
          curl -fsS "$API/storage/v1/bucket/stills" -H "apikey: $KEY" > /dev/null \
            || { echo "SUPABASE_SECRET_KEY was rejected. Copy it again from Supabase → Project Settings → API Keys."; exit 1; }
          echo "Secret key works."

      - name: Old rows
        run: |
          if [ "$DRY" = "true" ]; then END=rollback; else END=commit; fi
          docker run --rm -e DB_SAFE_URL -e PGPASSWORD postgres:17 psql "$DB_SAFE_URL" -v ON_ERROR_STOP=1 -q -c "
            begin;
            with p as (delete from public.puzzles where created_at < now() - interval '12 months' returning 1)
              select count(*) as old_gift_links from p;
            with f as (delete from public.films
                       where community and status in ('pending','rejected')
                         and created_at < now() - interval '12 months' returning 1)
              select count(*) as old_submissions from f;
            $END;"

      - name: Old uploaded images
        run: |
          docker run --rm -e DB_SAFE_URL -e PGPASSWORD postgres:17 psql "$DB_SAFE_URL" -At -c "
            select o.name from storage.objects o
            where o.bucket_id = 'stills'
              and o.name like 'uploads/%'
              and o.created_at < now() - interval '12 months'
              and not exists (select 1 from public.films   f where f.image_url like '%/' || o.name)
              and not exists (select 1 from public.puzzles p where p.image_url like '%/' || o.name)
            order by o.name;" > old.txt
          echo "Images to delete: $(grep -c . old.txt || true)"
          if [ "$DRY" = "true" ] || [ ! -s old.txt ]; then exit 0; fi
          split -l 100 old.txt batch_
          for b in batch_*; do
            body=$(jq -Rn '{prefixes: [inputs]}' < "$b")
            curl -fsS -X DELETE "$API/storage/v1/object/stills" \
              -H "apikey: $KEY" \
              -H "Content-Type: application/json" -d "$body" > /dev/null
          done
          echo "Done."
