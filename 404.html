<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wrong reel · Cut Scenes</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="stylesheet" href="/css/fonts.css">
<style>
  :root{--bg:#0A0909;--ink:#F2262B}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink)}
  body{display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box;font-family:"Instrument Sans",system-ui,sans-serif}
  .mono{font-family:"DM Mono",ui-monospace,monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;margin:0}
  h1{font-family:"League Gothic",Impact,sans-serif;font-variation-settings:"wdth" 75;font-weight:400;text-transform:uppercase;font-size:clamp(96px,22vw,260px);line-height:.85;margin:18px 0}
  p.line{font-size:18px;margin:0 0 28px}
  em{font-family:"Instrument Serif",serif;font-style:italic;font-size:1.15em}
  a{display:inline-block;color:var(--bg);background:var(--ink);text-decoration:none;padding:12px 20px;border-radius:999px;font-family:"DM Mono",monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase}
  a:focus-visible{outline:2px solid var(--ink);outline-offset:4px}
</style>
</head>
<body>
  <main>
    <p class="mono">Error 404 · Reel missing</p>
    <h1>Scene cut</h1>
    <p class="line">This page ended up on the editing room floor. <em>Happens to the best directors.</em></p>
    <a href="/">Back to the lobby</a>
  </main>
</body>
</html>
